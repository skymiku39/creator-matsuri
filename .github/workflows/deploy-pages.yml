name: Deploy GitHub Pages

# 網站唯一的部署來源：repo 設定 Pages → Source 必須是「GitHub Actions」。
# 建置成品不進版控（不要再提交 docs/ 或 dist/）。
on:
  push:
    branches: [master]
    paths:
      - 'dialogue-editor/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dialogue-editor
    env:
      # 網頁建置不需要下載 Electron 二進位
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dialogue-editor/package-lock.json

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 舊網址 /docs/ 導回根路徑，既有書籤不會失效
      - name: Redirect legacy /docs/ URL
        run: |
          mkdir -p dist/docs
          cat > dist/docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-Hant">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=../" />
              <title>創作者的文化祭｜攤位台詞流程編輯器</title>
              <script>
                location.replace('../' + location.hash)
              </script>
            </head>
            <body>
              <p><a href="../">進入編輯器</a></p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dialogue-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
